name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  build-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  build-android:
    runs-on: ubuntu-latest
    env:
      TURBO_CACHE_DIR: .turbo/android
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for Android
        uses: actions/cache@2f8e54208210a422b2efd51efaa6bd6d7ca8920f # v3.4.3
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-

      - name: Check turborepo cache for Android
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:android').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Install JDK
        if: env.turbo_cache_hit != 1
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        if: env.turbo_cache_hit != 1
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        if: env.turbo_cache_hit != 1
        uses: actions/cache@2f8e54208210a422b2efd51efaa6bd6d7ca8920f # v3.4.3
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: |
          yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}"

  build-ios:
    # macos-26 provides the Xcode 26 toolchain required by the example app.
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Pod linkage of the example app; the native ZelloSDK comes from SwiftPM in every leg.
        linkage: [dynamic, static, none]
    env:
      TURBO_CACHE_DIR: .turbo/ios-${{ matrix.linkage }}
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Select pod linkage (${{ matrix.linkage }})
        # `none` must leave USE_FRAMEWORKS undefined (not empty), as a plain local `pod install` does.
        run: |
          if [[ "${{ matrix.linkage }}" != "none" ]]; then
            echo "USE_FRAMEWORKS=${{ matrix.linkage }}" >> $GITHUB_ENV
          fi

      - name: Cache turborepo for iOS
        uses: actions/cache@2f8e54208210a422b2efd51efaa6bd6d7ca8920f # v3.4.3
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-${{ matrix.linkage }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-${{ matrix.linkage }}-

      - name: Cache cocoapods
        id: cocoapods-cache
        uses: actions/cache@2f8e54208210a422b2efd51efaa6bd6d7ca8920f # v3.4.3
        with:
          path: |
            **/ios/Pods
          key: ${{ runner.os }}-cocoapods-${{ matrix.linkage }}-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-${{ matrix.linkage }}-

      # Always runs (the cache only saves downloads): the example's Xcode project is integrated per
      # linkage, and the launch smoke below needs a built app even when the turbo build is cached.
      - name: Install pods (${{ matrix.linkage }})
        run: |
          cd example && bundle install
          cd ios && BUNDLE_GEMFILE=../Gemfile bundle exec pod install
        env:
          NO_FLIPPER: 1
          RCT_NEW_ARCH_ENABLED: 1

      # zello_post_install must be idempotent: a second install leaves the Xcode project unchanged.
      - name: Check Podfile helper idempotency
        if: matrix.linkage == 'none'
        run: |
          cd example/ios && BUNDLE_GEMFILE=../Gemfile bundle exec pod install
          git diff --exit-code -- *.xcodeproj
        env:
          NO_FLIPPER: 1
          RCT_NEW_ARCH_ENABLED: 1

      # Same (default) DerivedData as `build:ios`, which passes no -derivedDataPath.
      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace example/ios/ZelloSdkExample.xcworkspace \
            -scheme ZelloSdkExample

      - name: Build example for iOS
        run: |
          yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}"

      # A build alone does not catch a missing app-level link of the dynamic ZelloSDKUmbrella
      # (static/none linkage build fine, then crash on the first SDK call), so launch the app.
      - name: Launch smoke
        run: |
          APP=$(.github/scripts/ios-app-path.sh)
          .github/scripts/ios-launch-smoke.sh "$APP"

      # Runs after the smoke: it relinks the same app without Debug dylib stubs.
      - name: Bundle check
        run: |
          APP=$(.github/scripts/ios-app-path.sh --no-debug-dylib)
          .github/scripts/ios-bundle-check.sh "$APP"
